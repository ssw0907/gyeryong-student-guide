name: 최신 공고·프로그램 자동 수집

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: 최신 공고 수집
        run: python scripts/collect_notices.py
        continue-on-error: true  # 한쪽이 실패해도 다른 쪽 결과는 저장
      - name: 프로그램 목록 수집 (혜택·행사 자동 카드)
        run: python scripts/collect_programs.py
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경 내용 저장
        run: |
          git add data/notices.json data/auto-benefits.json data/auto-events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "자동 수집 $(TZ=Asia/Seoul date +%F)"
          git push
