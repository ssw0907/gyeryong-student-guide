name: 최신 공고 수집

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/collect_notices.py
      - name: 변경 내용 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/notices.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "최신 공고 자동 수집 $(TZ=Asia/Seoul date +%F)"
          git push
          # 워크플로의 푸시는 Pages 배포를 자동으로 시작하지 않을 수 있어 직접 요청함
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
