name: 임시 시험 - 정부 혜택 API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2
      - name: 건수 확인 (키는 출력하지 않음)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python - <<'EOF'
          import collections, os, re, requests, sys, time
          key = os.environ.get('DATA_GO_KR_KEY', '').strip()
          print('key present:', bool(key))
          URL = 'https://api.odcloud.kr/api/gov24/v3/serviceList'
          rows, page, total = [], 1, None
          while True:
              try:
                  r = requests.get(URL, params={'page': page, 'perPage': 1000, 'returnType': 'JSON'},
                                   headers={'Authorization': 'Infuser ' + key}, timeout=60)
              except requests.RequestException as e:
                  print('request failed:', type(e).__name__); sys.exit(1)
              print('page', page, 'status', r.status_code)
              if r.status_code != 200:
                  print('body:', r.text[:200].replace(key, '***')); sys.exit(1)
              d = r.json()
              total = d.get('totalCount')
              rows += d.get('data') or []
              if not d.get('data') or len(rows) >= (total or 0):
                  break
              page += 1
              time.sleep(0.5)
          print('total', total, 'read', len(rows))
          if rows:
              print('fields', sorted(rows[0].keys()))
          org = lambda x: str(x.get('소관기관명') or '')
          text = lambda x: ' '.join(str(x.get(k) or '') for k in ('소관기관명', '서비스명', '접수기관', '지원대상'))
          print('types', collections.Counter(x.get('소관기관유형') for x in rows).most_common(10))
          STUDENT = re.compile(r'초등|중학|학생|청소년|아동|어린이|자녀|입학|교복|장학|학교|수학여행|다자녀|교육비')
          for name, pat in (('계룡시', r'계룡'), ('충남', r'충청남도|충남'), ('대전', r'대전')):
              a = [x for x in rows if re.search(pat, org(x))]
              b = [x for x in rows if not re.search(pat, org(x)) and re.search(pat, text(x))]
              s = [x for x in a if STUDENT.search(str(x.get('서비스명')) + str(x.get('지원대상')))]
              print('==', name, 'org match', len(a), 'other-field match', len(b), 'student words', len(s))
              print('   orgs', collections.Counter(org(x) for x in a).most_common(8))
              for x in s[:25]:
                  print('   -', org(x)[:18], '|', str(x.get('서비스명'))[:45], '|', str(x.get('신청기한'))[:20], '|', str(x.get('상세조회URL'))[:60])
          n = [x for x in rows if x.get('소관기관유형') == '중앙행정기관' and STUDENT.search(str(x.get('서비스명')))]
          print('== national student-word services', len(n))
          EOF
